# fly.toml app configuration file generated for idc-next-website on 2026-10-11T14:24:22+04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'idc-next-website'
primary_region = 'ams'

[build.args]
  NEXT_PUBLIC_YANDEX_METRIKA_ID = "107091121"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/"
